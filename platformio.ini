[platformio]
default_envs = washer_es3c35p

[env:washer_es3c35p]
platform = espressif32@6.12.0
board = washer_es3c35p
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
  lvgl/lvgl@8.4.0
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -Os
  -Wl,--gc-sections
  -ffunction-sections
  -fdata-sections
